apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsc-sec-engine
  namespace: fsc
  labels:
    app: fsc-sec-engine
spec:
  replicas: 10
  selector:
    matchLabels:
      app: fsc-sec-engine
  template:
    metadata:
      labels:
        app: fsc-sec-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: fsc-sec-engine
          image: ghcr.io/your-org/fsc-sec-engine:latest
          ports:
            - containerPort: 8081   # HTTP (actuator)
            - containerPort: 9092   # gRPC (port atualizado)
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: fsc-secrets
                  key: db-url
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "fsc-kafka-service:9092"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 5
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms1g -Xmx3g
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=150
                -XX:ConcGCThreads=4
                -XX:+UseStringDeduplication
          resources:
            requests:
              cpu: "1"
              memory: "1.5Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: fsc-sec-engine-service
  namespace: fsc
spec:
  selector:
    app: fsc-sec-engine
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: grpc
      protocol: TCP
      port: 9092
      targetPort: 9092
  type: ClusterIP
