apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsc-gateway
  namespace: fsc
  labels:
    app: fsc-gateway
spec:
  replicas: 5
  selector:
    matchLabels:
      app: fsc-gateway
  template:
    metadata:
      labels:
        app: fsc-gateway
      annotations:
        # Necessário para o Prometheus Operator coletar métricas
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: fsc-gateway
          image: ghcr.io/your-org/fsc-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: fsc-secrets
                  key: db-url
            - name: SPRING_DATA_REDIS_HOST
              value: "fsc-redis-service"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "fsc-kafka-service:9092"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 5
          env:
            - name: JAVA_OPTS
              value: >-
                -Xms512m -Xmx1500m
                -XX:+UseG1GC
                -XX:MaxGCPauseMillis=100
                -XX:+UseStringDeduplication
                -Djava.util.concurrent.ForkJoinPool.common.parallelism=16
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: fsc-gateway-service
  namespace: fsc
spec:
  selector:
    app: fsc-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
