name: CI - FSC Sec Engine

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'fsc-sec-engine/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'fsc-sec-engine/**'

env:
  JAVA_VERSION: '22'

jobs:
  build-and-test:
    name: Build, Test, ArchUnit & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B compile --file pom.xml

      - name: Run Tests (Testcontainers + ArchUnit)
        # Testcontainers precisa de acesso ao Docker daemon
        run: mvn -B test --file fsc-sec-engine/pom.xml
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Package JAR
        run: mvn -B package -DskipTests --file fsc-sec-engine/pom.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fsc-sec-engine-jar
          path: fsc-sec-engine/target/fsc-sec-engine.jar
          retention-days: 7
